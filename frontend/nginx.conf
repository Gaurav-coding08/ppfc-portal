# Serves the built SPA and forwards API calls to the backend container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same origin for the API: /api/v1/... → http://api:4000/api/v1/...
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite puts a content hash in every asset file name, so they can be cached
  # for good; index.html is never cached, so a rebuild is picked up at once.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/projects/1, /dashboard?…) all load index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }
}
