services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ppfc
      POSTGRES_PASSWORD: ppfc_dev_pw
      POSTGRES_DB: ppfc
    volumes:
      - ppfc_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppfc -d ppfc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Proves the API also runs containerised. Local dev normally uses `npm run dev`
  # against the `db` service above instead.
  api:
    profiles: ["app"]
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    # backend/.env's DATABASE_URL points at localhost:5433 (correct for
    # `npm run dev` on the host, where Postgres is published on that
    # port). Inside the compose network, Postgres is reachable by its
    # service name on the default port instead — override just this var.
    environment:
      DATABASE_URL: postgres://ppfc:ppfc_dev_pw@db:5432/ppfc
    # API_PORT lets the container publish elsewhere when `npm run dev`
    # already holds 4000 on the host (the web service reaches the API over
    # the compose network either way).
    ports:
      - "${API_PORT:-4000}:4000"

  # Same image as `api`, running the automation scheduler instead of the
  # HTTP server (feature 15) — overdue-escalation producer + outbox
  # dispatcher on AUTOMATION_CRON.
  worker:
    profiles: ["app"]
    build:
      context: ./backend
    command: node dist/worker.js
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://ppfc:ppfc_dev_pw@db:5432/ppfc

  # The React SPA (feature 18 Part C): built by frontend/Dockerfile and
  # served by nginx, which proxies /api to the `api` service above — open
  # http://localhost:8080. The E2E suite targets this by default.
  web:
    profiles: ["app"]
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  ppfc_pg_data:
