openapi: 3.0.3
info:
  title: PPFC Portal API
  description: Project Portfolio & Financial Control — internal PMO API.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

# ─── Authentication ──────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ppfc_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - VERSION_CONFLICT
                - INVALID_TRANSITION
                - SELF_APPROVAL_FORBIDDEN
                - BUSINESS_RULE
                - IDEMPOTENCY_CONFLICT
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
            details:
              {}
            requestId:
              type: string
              format: uuid

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [contributor, project_manager, admin] }
        departmentId: { type: integer, nullable: true }
        isActive: { type: boolean }
        version: { type: integer }

    Project:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        departmentId: { type: integer }
        ownerId: { type: integer }
        status: { type: string, enum: [active, on_hold, completed, cancelled] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        version: { type: integer }
        progressPct: { type: number, nullable: true }
        deliveryStatus: { type: string, nullable: true }

    Task:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        assigneeId: { type: integer, nullable: true }
        status: { type: string, enum: [todo, in_progress, done, blocked] }
        priority: { type: string, enum: [low, medium, high, critical] }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date }
        # NUMERIC in the DB; the API returns it as a plain number (e.g. 1, 2.5).
        weight: { type: number }
        progress: { type: integer, minimum: 0, maximum: 100 }
        isOverdue: { type: boolean }
        isDueSoon: { type: boolean }
        version: { type: integer }

    Milestone:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [planned, achieved, missed] }
        achievedDate: { type: string, format: date, nullable: true }
        isOverdue: { type: boolean }
        daysToDue: { type: integer, nullable: true }
        version: { type: integer }

    Risk:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        type: { type: string, enum: [risk, issue] }
        title: { type: string }
        description: { type: string, nullable: true }
        ownerId: { type: integer }
        probability: { type: integer, minimum: 1, maximum: 5 }
        impact: { type: integer, minimum: 1, maximum: 5 }
        score: { type: integer }
        exposure: { type: string, enum: [low, medium, high] }
        mitigation: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, mitigating, closed] }
        version: { type: integer }

    ChangeRequest:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        impactSummary: { type: string, nullable: true }
        requestedBy: { type: integer }
        status: { type: string, enum: [submitted, approved, rejected, returned] }
        decidedBy: { type: integer, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
        version: { type: integer }

    CostTransaction:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        categoryId: { type: integer }
        txnDate: { type: string, format: date }
        amount: { type: number }
        signedAmount: { type: number }
        description: { type: string }
        vendor: { type: string, nullable: true }
        status: { type: string, enum: [draft, posted] }
        entryType: { type: string, enum: [expense, reversal] }
        reversesId: { type: integer, nullable: true }
        version: { type: integer }

    BudgetRevision:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        amount: { type: number }
        rationale: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requestedBy: { type: integer }
        decidedBy: { type: integer, nullable: true }
        effectiveDate: { type: string, format: date }
        version: { type: integer }

    Forecast:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        amount: { type: number }

    # ── Response envelopes added in feature 16 (frontend M1) ──
    # The schemas above this point predate the frontend work and were never
    # referenced by a response (every path below just said "description: OK"
    # with no content schema), so `openapi-typescript` generated unusable
    # response types. These envelopes were written from real API responses
    # captured against the seeded dev DB, not guessed — see
    # .claude/context/16-frontend-m1-foundation-delivery.md Part A.
    AuthUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [contributor, project_manager, admin] }
        departmentId: { type: integer, nullable: true }

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            token: { type: string }

    Membership:
      type: object
      properties:
        projectId: { type: integer }
        projectCode: { type: string }
        memberRole: { type: string, enum: [manager, contributor] }

    MeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            memberships:
              type: array
              items: { $ref: '#/components/schemas/Membership' }

    Department:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    DepartmentListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Department' }

    UserDirectoryEntry:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserDirectoryEntry' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    UserDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/UserDirectoryEntry' }

    DepartmentRef:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    OwnerRef:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string }

    ProjectListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        owner: { $ref: '#/components/schemas/OwnerRef' }
        status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        progressPct: { type: number, nullable: true }
        deliveryStatus:
          type: string
          nullable: true
          enum: [on_track, behind, at_risk, completed]
        version: { type: integer }

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectListItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ProjectMember:
      type: object
      properties:
        userId: { type: integer }
        fullName: { type: string }
        email: { type: string }
        memberRole: { type: string, enum: [manager, contributor] }
        addedAt: { type: string, format: date-time }

    ProjectCounts:
      type: object
      properties:
        taskCount: { type: integer }
        overdueTaskCount: { type: integer }
        openRiskCount: { type: integer }
        pendingCrCount: { type: integer }

    ProjectBudgetHeadline:
      type: object
      properties:
        currentBudget: { type: number }
        actualSpend: { type: number }
        utilization: { type: number, nullable: true }
        currency: { type: string, example: AED }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectListItem'
        - type: object
          properties:
            description: { type: string, nullable: true }
            members:
              type: array
              items: { $ref: '#/components/schemas/ProjectMember' }
            counts: { $ref: '#/components/schemas/ProjectCounts' }
            budget: { $ref: '#/components/schemas/ProjectBudgetHeadline' }

    ProjectDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProjectDetail' }

    ProjectMembersResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectMember' }

    ProgressSnapshot:
      type: object
      properties:
        snapshotDate: { type: string, format: date }
        progressPct: { type: number }
        actualSpend: { type: number }

    ProgressSnapshotsResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressSnapshot' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ActivityEvent:
      type: object
      properties:
        id: { type: integer }
        actorId: { type: integer, nullable: true }
        actorName: { type: string, nullable: true }
        entityType: { type: string }
        entityId: { type: integer }
        action: { type: string }
        projectId: { type: integer, nullable: true }
        before: {}
        after: {}
        requestId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ActivityListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TaskRow:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            assigneeName: { type: string, nullable: true }
            completedAt: { type: string, format: date-time, nullable: true }

    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaskRow' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TaskDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TaskRow' }

    MilestoneListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Milestone' }

    MilestoneDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Milestone' }

    # Dashboard itself ships in milestone 3 — this one field is enriched
    # now because Part A's topbar reads `meta.asOf` off this endpoint for
    # the "Data as of" badge (feature spec Part A.5: "if none is exposed,
    # read it from an existing endpoint's asOf"). The rest of the dashboard
    # response shapes are left as-is for M3 to fill in.
    DashboardMeta:
      type: object
      properties:
        asOf: { type: string, format: date }
        appliedFilters: { type: array, items: {} }
        ignoredFilters: { type: array, items: {} }
        generatedAt: { type: string, format: date-time }

    # Enriched in feature 16 Part B: the projects list's owner filter reads
    # `managers` from here, the one option list every role can call.
    FilterOption:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }

    DashboardFiltersResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            departments: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }
            projects: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }
            managers: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }
            statuses: { type: array, items: { type: string } }
            categories: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }

  parameters:
    pageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    pageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    asOfParam:
      name: asOf
      in: query
      schema: { type: string, format: date }
      description: Reporting cut-off date; defaults to app_settings.reporting_date (2026-09-30).
    # Shared by GET /projects/{projectId}/tasks and GET /tasks/mine
    # (backend tasks.schemas.ts taskFilterFields).
    taskStatusParam:
      name: status
      in: query
      schema: { type: string }
      description: One status or a comma-separated list (todo,in_progress,blocked,done).
    taskPriorityParam:
      name: priority
      in: query
      schema: { type: string, enum: [low, medium, high, critical] }
    taskOverdueParam:
      name: overdue
      in: query
      schema: { type: string, enum: ['true', 'false'] }
    taskSortParam:
      name: sort
      in: query
      schema: { type: string, enum: [dueDate, priority, status, progress, title], default: dueDate }

security:
  - cookieAuth: []
  - bearerAuth: []

# ─── Paths ───────────────────────────────────────────────────────
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      db: { type: string }
        '503':
          description: DB unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: degraded }
                      db: { type: string, example: down }

  # ── Auth ──
  /auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limited

  /auth/me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      summary: Log out
      responses:
        '204': { description: Cookie cleared }

  # ── Departments ──
  /departments:
    get:
      summary: List all departments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentListResponse' }

  # ── Users ──
  /users:
    get:
      summary: List users (PM sees scoped, admin sees all)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: integer } }
        - { name: projectId, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
        - name: sort
          in: query
          schema: { type: string, enum: [fullName, email, role, createdAt], default: fullName }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '403': { description: Contributor not allowed }

  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '404': { description: Not found or out of scope }

  # ── Admin ──
  /admin/users:
    post:
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, role, departmentId, password]
              properties:
                email: { type: string }
                fullName: { type: string }
                role: { type: string }
                departmentId: { type: integer }
                password: { type: string }
      responses:
        '201': { description: Created }
        '403': { description: Not admin }

  /admin/users/{id}:
    patch:
      summary: Update user (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                fullName: { type: string }
                role: { type: string }
                departmentId: { type: integer }
                isActive: { type: boolean }
                version: { type: integer }
      responses:
        '200': { description: Updated }
        '409': { description: Version conflict }

  /admin/audit-events:
    get:
      summary: List audit events (admin)
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: integer } }
        - { name: projectId, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200': { description: OK }

  # ── Projects ──
  /projects:
    get:
      summary: List projects (scoped)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: integer } }
        - { name: ownerId, in: query, schema: { type: integer } }
        - name: status
          in: query
          description: One status or a comma-separated list (planning,active,on_hold,completed,cancelled).
          schema: { type: string }
        - { name: startFrom, in: query, schema: { type: string, format: date } }
        - { name: endTo, in: query, schema: { type: string, format: date } }
        - name: sort
          in: query
          schema: { type: string, enum: [code, name, status, startDate, endDate, progress], default: code }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, departmentId, ownerId, status, startDate, endDate, initialBudget]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                departmentId: { type: integer }
                ownerId: { type: integer }
                status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                initialBudget: { type: number, minimum: 0 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProjectListItem' }

  /projects/{id}:
    get:
      summary: Get project detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '404': { description: Not found or out of scope }
    patch:
      summary: Update project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string }
                description: { type: string }
                departmentId: { type: integer }
                ownerId: { type: integer }
                status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                version: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProjectListItem' }
        '409': { description: Version conflict }

  /projects/{id}/members:
    get:
      summary: List project members
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMembersResponse' }
    post:
      summary: Add member
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, memberRole]
              properties:
                userId: { type: integer }
                memberRole: { type: string, enum: [manager, contributor] }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProjectMember' }

  /projects/{id}/members/{userId}:
    delete:
      summary: Remove member
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Removed }

  /projects/{id}/progress-snapshots:
    get:
      summary: Progress snapshots
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSnapshotsResponse' }

  /projects/{projectId}/activity:
    get:
      summary: Project audit activity
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
