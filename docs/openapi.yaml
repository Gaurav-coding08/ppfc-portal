openapi: 3.0.3
info:
  title: PPFC Portal API
  description: Project Portfolio & Financial Control — internal PMO API.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

# ─── Authentication ──────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ppfc_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - VERSION_CONFLICT
                - INVALID_TRANSITION
                - SELF_APPROVAL_FORBIDDEN
                - BUSINESS_RULE
                - IDEMPOTENCY_CONFLICT
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
            details:
              {}
            requestId:
              type: string
              format: uuid

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [contributor, project_manager, admin] }
        departmentId: { type: integer, nullable: true }
        isActive: { type: boolean }
        version: { type: integer }

    Project:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        departmentId: { type: integer }
        ownerId: { type: integer }
        status: { type: string, enum: [active, on_hold, completed, cancelled] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        version: { type: integer }
        progressPct: { type: number, nullable: true }
        deliveryStatus: { type: string, nullable: true }

    Task:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        assigneeId: { type: integer, nullable: true }
        status: { type: string, enum: [todo, in_progress, done, blocked] }
        priority: { type: string, enum: [low, medium, high, critical] }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date }
        # NUMERIC in the DB; the API returns it as a plain number (e.g. 1, 2.5).
        weight: { type: number }
        progress: { type: integer, minimum: 0, maximum: 100 }
        isOverdue: { type: boolean }
        isDueSoon: { type: boolean }
        version: { type: integer }

    Milestone:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [planned, achieved, missed] }
        achievedDate: { type: string, format: date, nullable: true }
        isOverdue: { type: boolean }
        daysToDue: { type: integer, nullable: true }
        version: { type: integer }

    Risk:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        type: { type: string, enum: [risk, issue] }
        title: { type: string }
        description: { type: string, nullable: true }
        ownerId: { type: integer, nullable: true }
        ownerName: { type: string, nullable: true }
        probability: { type: integer, minimum: 1, maximum: 5 }
        impact: { type: integer, minimum: 1, maximum: 5 }
        score: { type: integer }
        exposure: { type: string, enum: [low, medium, high] }
        mitigation: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, mitigating, closed] }
        closedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }

    ChangeRequest:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        impactSummary: { type: string, nullable: true }
        requestedBy: { type: integer }
        status: { type: string, enum: [submitted, approved, rejected, returned] }
        decidedBy: { type: integer, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
        version: { type: integer }

    CostTransaction:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        categoryId: { type: integer }
        txnDate: { type: string, format: date }
        amount: { type: number }
        signedAmount: { type: number }
        description: { type: string }
        vendor: { type: string, nullable: true }
        status: { type: string, enum: [draft, posted] }
        entryType: { type: string, enum: [expense, reversal] }
        reversesId: { type: integer, nullable: true }
        version: { type: integer }
        # Joined names and posting fields (feature 17 Part B, from live responses)
        categoryName: { type: string }
        createdBy: { type: integer }
        createdByName: { type: string }
        postedBy: { type: integer, nullable: true }
        postedByName: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # budget_revisions has no version column: decisions are guarded by
    # `status = 'pending'` instead (feature 11 context), so the response
    # carries no version. The decision body still requires one (any int >= 1).
    BudgetRevision:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        amount: { type: number }
        rationale: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requestedBy: { type: integer }
        requestedByName: { type: string }
        decidedBy: { type: integer, nullable: true }
        decidedByName: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
        effectiveDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    # Responses return the month as the first of the month (YYYY-MM-01);
    # the PUT body takes YYYY-MM.
    Forecast:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        month: { type: string, format: date }
        amount: { type: number }
        updatedBy: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time }

    # ── Response envelopes added in feature 16 (frontend M1) ──
    # The schemas above this point predate the frontend work and were never
    # referenced by a response (every path below just said "description: OK"
    # with no content schema), so `openapi-typescript` generated unusable
    # response types. These envelopes were written from real API responses
    # captured against the seeded dev DB, not guessed — see
    # .claude/context/16-frontend-m1-foundation-delivery.md Part A.
    AuthUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [contributor, project_manager, admin] }
        departmentId: { type: integer, nullable: true }

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            token: { type: string }

    Membership:
      type: object
      properties:
        projectId: { type: integer }
        projectCode: { type: string }
        memberRole: { type: string, enum: [manager, contributor] }

    MeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            memberships:
              type: array
              items: { $ref: '#/components/schemas/Membership' }

    Department:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    DepartmentListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Department' }

    UserDirectoryEntry:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserDirectoryEntry' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    UserDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/UserDirectoryEntry' }

    DepartmentRef:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    OwnerRef:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string }

    ProjectListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        department: { $ref: '#/components/schemas/DepartmentRef' }
        owner: { $ref: '#/components/schemas/OwnerRef' }
        status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        progressPct: { type: number, nullable: true }
        deliveryStatus:
          type: string
          nullable: true
          enum: [on_track, behind, at_risk, completed]
        version: { type: integer }

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectListItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ProjectMember:
      type: object
      properties:
        userId: { type: integer }
        fullName: { type: string }
        email: { type: string }
        memberRole: { type: string, enum: [manager, contributor] }
        addedAt: { type: string, format: date-time }

    ProjectCounts:
      type: object
      properties:
        taskCount: { type: integer }
        overdueTaskCount: { type: integer }
        openRiskCount: { type: integer }
        pendingCrCount: { type: integer }

    ProjectBudgetHeadline:
      type: object
      properties:
        currentBudget: { type: number }
        actualSpend: { type: number }
        utilization: { type: number, nullable: true }
        currency: { type: string, example: AED }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectListItem'
        - type: object
          properties:
            description: { type: string, nullable: true }
            members:
              type: array
              items: { $ref: '#/components/schemas/ProjectMember' }
            counts: { $ref: '#/components/schemas/ProjectCounts' }
            budget: { $ref: '#/components/schemas/ProjectBudgetHeadline' }

    ProjectDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ProjectDetail' }

    ProjectMembersResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProjectMember' }

    ProgressSnapshot:
      type: object
      properties:
        snapshotDate: { type: string, format: date }
        progressPct: { type: number }
        actualSpend: { type: number }

    ProgressSnapshotsResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressSnapshot' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ActivityEvent:
      type: object
      properties:
        id: { type: integer }
        actorId: { type: integer, nullable: true }
        actorName: { type: string, nullable: true }
        entityType: { type: string }
        entityId: { type: integer }
        action: { type: string }
        projectId: { type: integer, nullable: true }
        before: {}
        after: {}
        requestId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ActivityListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TaskRow:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            assigneeName: { type: string, nullable: true }
            completedAt: { type: string, format: date-time, nullable: true }

    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaskRow' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TaskDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TaskRow' }

    MilestoneListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Milestone' }

    MilestoneDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Milestone' }

    # Dashboard itself ships in milestone 3 — this one field is enriched
    # now because Part A's topbar reads `meta.asOf` off this endpoint for
    # the "Data as of" badge (feature spec Part A.5: "if none is exposed,
    # read it from an existing endpoint's asOf"). The rest of the dashboard
    # response shapes are left as-is for M3 to fill in.
    DashboardMeta:
      type: object
      properties:
        asOf: { type: string, format: date }
        appliedFilters: { type: array, items: {} }
        ignoredFilters: { type: array, items: {} }
        generatedAt: { type: string, format: date-time }

    # Enriched in feature 16 Part B: the projects list's owner filter reads
    # `managers` from here, the one option list every role can call.
    FilterOption:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }

    DashboardFiltersResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            departments: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }
            projects: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }
            managers: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }
            statuses: { type: array, items: { type: string } }
            categories: { type: array, items: { $ref: '#/components/schemas/FilterOption' } }

    # ── Added in feature 17 Part A (risks & change requests), from real
    # responses against the seeded dev DB ──
    RiskListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Risk' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    RiskDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Risk' }

    ChangeRequestRow:
      allOf:
        - $ref: '#/components/schemas/ChangeRequest'
        - type: object
          properties:
            requesterName: { type: string }
            submittedAt: { type: string, format: date-time }
            deciderName: { type: string, nullable: true }

    ChangeHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        # null on the first entry (the original submission)
        fromStatus:
          type: string
          nullable: true
          enum: [submitted, approved, rejected, returned]
        toStatus: { type: string, enum: [submitted, approved, rejected, returned] }
        actorId: { type: integer }
        actorName: { type: string }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ChangeRequestDetail:
      allOf:
        - $ref: '#/components/schemas/ChangeRequestRow'
        - type: object
          properties:
            history:
              type: array
              items: { $ref: '#/components/schemas/ChangeHistoryEntry' }

    ChangeRequestListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ChangeRequestRow' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ChangeRequestCreatedResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ChangeRequestRow' }

    ChangeRequestDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ChangeRequestDetail' }

    # ── Added in feature 17 Part B (finance), from real responses against
    # the seeded dev DB. Every money field is computed in SQL
    # (fn_project_financials) and returned as a number rounded to 2 dp. ──
    BudgetSummary:
      type: object
      properties:
        initialAmount: { type: number }
        approvedRevisionsTotal: { type: number }
        currentBudget: { type: number }
        currency: { type: string }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/BudgetRevision' }

    BudgetSummaryResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BudgetSummary' }

    BudgetRevisionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BudgetRevision' }

    CostCategory:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        isActive: { type: boolean }

    CostCategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CostCategory' }

    CostCategoryResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CostCategory' }

    CostListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CostTransaction' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    CostDetailResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CostTransaction' }

    # POST /costs/{id}/post also returns the project's spend figures as of
    # the cost's own date. The UI ignores them and refetches the summary.
    CostPostResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CostTransaction' }
        financials:
          type: object
          properties:
            actualSpend: { type: number }
            remainingBudget: { type: number }
            utilization: { type: number, nullable: true }
            currency: { type: string }

    ForecastsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            forecasts:
              type: array
              items: { $ref: '#/components/schemas/Forecast' }
            forecastToComplete: { type: number }
            currency: { type: string }

    ProjectFinancials:
      type: object
      properties:
        projectId: { type: integer }
        initialBudget: { type: number }
        approvedRevisions: { type: number }
        currentBudget: { type: number }
        actualSpend: { type: number }
        remainingBudget: { type: number }
        # actual / NULLIF(current budget, 0) — null when the budget is 0
        utilization: { type: number, nullable: true }
        forecastToComplete: { type: number }
        eac: { type: number }
        projectedVariance: { type: number }
        forecastMissing: { type: boolean }
        isOverrun: { type: boolean }
        isNearBudget: { type: boolean }

    SpendByCategoryRow:
      type: object
      properties:
        categoryId: { type: integer }
        categoryCode: { type: string }
        categoryName: { type: string }
        totalSpend: { type: number }

    MonthlyTrendRow:
      type: object
      properties:
        month: { type: string, format: date }
        actualSpend: { type: number, nullable: true }
        forecast: { type: number, nullable: true }

    FinanceAlert:
      type: object
      properties:
        projectId: { type: integer }
        # Empty strings on the per-project summary's alerts
        projectCode: { type: string }
        projectName: { type: string }
        alertType: { type: string, enum: [OVERRUN_FORECAST, NEAR_BUDGET, OVERSPENT, FORECAST_MISSING] }
        severity: { type: string, enum: [critical, warning, info] }
        currentBudget: { type: number }
        actualSpend: { type: number }
        eac: { type: number }
        utilization: { type: number, nullable: true }

    FinancialSummaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            financials: { $ref: '#/components/schemas/ProjectFinancials' }
            spendByCategory:
              type: array
              items: { $ref: '#/components/schemas/SpendByCategoryRow' }
            monthlyTrend:
              type: array
              items: { $ref: '#/components/schemas/MonthlyTrendRow' }
            alerts:
              type: array
              items: { $ref: '#/components/schemas/FinanceAlert' }
            currency: { type: string }

    FinanceAlertsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            alerts:
              type: array
              items: { $ref: '#/components/schemas/FinanceAlert' }
            currency: { type: string }

    FinanceComparisonResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            projects:
              type: array
              items: { $ref: '#/components/schemas/ProjectFinancials' }
            # Requested ids the caller can't see (or that don't exist)
            excluded:
              type: array
              items: { type: integer }
            currency: { type: string }

  parameters:
    pageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    pageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    asOfParam:
      name: asOf
      in: query
      schema: { type: string, format: date }
      description: Reporting cut-off date; defaults to app_settings.reporting_date (2026-09-30).
    # Shared by GET /projects/{projectId}/tasks and GET /tasks/mine
    # (backend tasks.schemas.ts taskFilterFields).
    taskStatusParam:
      name: status
      in: query
      schema: { type: string }
      description: One status or a comma-separated list (todo,in_progress,blocked,done).
    taskPriorityParam:
      name: priority
      in: query
      schema: { type: string, enum: [low, medium, high, critical] }
    taskOverdueParam:
      name: overdue
      in: query
      schema: { type: string, enum: ['true', 'false'] }
    taskSortParam:
      name: sort
      in: query
      schema: { type: string, enum: [dueDate, priority, status, progress, title], default: dueDate }
    # Shared by GET /projects/{projectId}/risks and GET /risks
    # (backend risks.schemas.ts commonListFields).
    riskTypeParam:
      name: type
      in: query
      schema: { type: string, enum: [risk, issue] }
    riskStatusParam:
      name: status
      in: query
      schema: { type: string }
      description: One status or a comma-separated list (open,mitigating,closed).
    riskOwnerParam:
      name: ownerId
      in: query
      schema: { type: integer }
    riskMinScoreParam:
      name: minScore
      in: query
      schema: { type: integer, minimum: 1, maximum: 25 }
    riskQParam:
      name: q
      in: query
      schema: { type: string }
    riskSortParam:
      name: sort
      in: query
      schema: { type: string, enum: [score, dueDate, status], default: score }
    riskOrderParam:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    # Shared by GET /projects/{projectId}/costs and GET /costs
    # (backend costs.schemas.ts).
    costStatusParam:
      name: status
      in: query
      schema: { type: string }
      description: One status or a comma-separated list (draft,posted).
    costCategoryParam:
      name: categoryId
      in: query
      schema: { type: integer }
    costFromParam:
      name: from
      in: query
      schema: { type: string, format: date }
    costToParam:
      name: to
      in: query
      schema: { type: string, format: date }
    costEntryTypeParam:
      name: entryType
      in: query
      schema: { type: string, enum: [expense, reversal] }
    costQParam:
      name: q
      in: query
      schema: { type: string }
      description: Matches description or vendor (ILIKE).
    costSortParam:
      name: sort
      in: query
      schema: { type: string, enum: [txnDate, amount, status], default: txnDate }
    costOrderParam:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

security:
  - cookieAuth: []
  - bearerAuth: []

# ─── Paths ───────────────────────────────────────────────────────
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      db: { type: string }
        '503':
          description: DB unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: degraded }
                      db: { type: string, example: down }

  # ── Auth ──
