  # ── Tasks ──
  /projects/{projectId}/tasks:
    get:
      summary: List project tasks
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/taskStatusParam' }
        - { name: assigneeId, in: query, schema: { type: integer } }
        - { name: unassigned, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { $ref: '#/components/parameters/taskPriorityParam' }
        - { $ref: '#/components/parameters/taskOverdueParam' }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/taskSortParam' }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
    post:
      summary: Create task
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, priority, dueDate, weight]
              properties:
                title: { type: string }
                description: { type: string }
                assigneeId: { type: integer }
                status: { type: string, enum: [todo, in_progress, blocked, done] }
                priority: { type: string, enum: [low, medium, high, critical] }
                startDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                weight: { type: number, exclusiveMinimum: true, minimum: 0 }
                progress: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetailResponse' }

  /tasks/mine:
    get:
      summary: Caller's own tasks
      parameters:
        - { $ref: '#/components/parameters/taskStatusParam' }
        - { $ref: '#/components/parameters/taskPriorityParam' }
        - { $ref: '#/components/parameters/taskOverdueParam' }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/taskSortParam' }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: '#/components/parameters/asOfParam' }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }

  /tasks/{id}:
    get:
      summary: Get task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetailResponse' }
    patch:
      summary: Update task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              description: >-
                At least one field besides version. A contributor who is the
                task's assignee may send only progress/status (else 403 with
                details.fields listing the rejected keys).
              properties:
                title: { type: string }
                description: { type: string }
                assigneeId: { type: integer, nullable: true }
                status: { type: string, enum: [todo, in_progress, blocked, done] }
                priority: { type: string, enum: [low, medium, high, critical] }
                startDate: { type: string, format: date, nullable: true }
                dueDate: { type: string, format: date }
                weight: { type: number, exclusiveMinimum: true, minimum: 0 }
                progress: { type: integer, minimum: 0, maximum: 100 }
                version: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetailResponse' }
    delete:
      summary: Delete task (todo, 0% only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Deleted }

  # ── Milestones ──
  /projects/{projectId}/milestones:
    get:
      summary: List milestones
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [planned, achieved, missed] } }
        - { name: dueWithinDays, in: query, schema: { type: integer, minimum: 0 } }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MilestoneListResponse' }
    post:
      summary: Create milestone
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dueDate]
              properties:
                name: { type: string }
                dueDate: { type: string, format: date }
                status: { type: string, enum: [planned, achieved, missed] }
                achievedDate: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MilestoneDetailResponse' }

  /milestones/{id}:
    patch:
      summary: Update milestone
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name: { type: string }
                dueDate: { type: string, format: date }
                status: { type: string, enum: [planned, achieved, missed] }
                achievedDate: { type: string, format: date, nullable: true }
                version: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MilestoneDetailResponse' }

  # ── Risks ──
  # Params/bodies mirror backend risks.schemas.ts; responses enriched in
  # feature 17 Part A from real responses.
  /projects/{projectId}/risks:
    get:
      summary: List project risks
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/riskTypeParam' }
        - { $ref: '#/components/parameters/riskStatusParam' }
        - { $ref: '#/components/parameters/riskOwnerParam' }
        - { $ref: '#/components/parameters/riskMinScoreParam' }
        - { $ref: '#/components/parameters/riskQParam' }
        - { $ref: '#/components/parameters/riskSortParam' }
        - { $ref: '#/components/parameters/riskOrderParam' }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskListResponse' }
    post:
      summary: Create risk
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, ownerId, probability, impact]
              description: >-
                mitigation is required (422 BUSINESS_RULE) when
                probability × impact >= 15. ownerId must be a project member.
              properties:
                type: { type: string, enum: [risk, issue] }
                title: { type: string }
                description: { type: string }
                ownerId: { type: integer }
                probability: { type: integer, minimum: 1, maximum: 5 }
                impact: { type: integer, minimum: 1, maximum: 5 }
                mitigation: { type: string }
                dueDate: { type: string, format: date }
                status: { type: string, enum: [open, mitigating, closed] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskDetailResponse' }

  /risks:
    get:
      summary: Cross-portfolio risks (scoped)
      parameters:
        - { name: projectId, in: query, schema: { type: integer } }
        - { name: departmentId, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/riskTypeParam' }
        - { $ref: '#/components/parameters/riskStatusParam' }
        - { $ref: '#/components/parameters/riskOwnerParam' }
        - { $ref: '#/components/parameters/riskMinScoreParam' }
        - { $ref: '#/components/parameters/riskQParam' }
        - { $ref: '#/components/parameters/riskSortParam' }
        - { $ref: '#/components/parameters/riskOrderParam' }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskListResponse' }

  /risks/high-exposure:
    get:
      summary: High-exposure open risks (scoped; status <> closed, score >= 15, score desc)
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskListResponse' }

  /risks/{id}:
    get:
      summary: Get risk
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskDetailResponse' }
    patch:
      summary: Update risk
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              description: >-
                At least one field besides version. The mitigation rule is
                re-checked against the merged (current + patch) state.
              properties:
                type: { type: string, enum: [risk, issue] }
                title: { type: string }
                description: { type: string }
                ownerId: { type: integer, nullable: true }
                probability: { type: integer, minimum: 1, maximum: 5 }
                impact: { type: integer, minimum: 1, maximum: 5 }
                mitigation: { type: string, nullable: true }
                dueDate: { type: string, format: date, nullable: true }
                status: { type: string, enum: [open, mitigating, closed] }
                version: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskDetailResponse' }

  # ── Change Requests ──
  /projects/{projectId}/change-requests:
    post:
      summary: Submit change request (any member)
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                impactSummary: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequestCreatedResponse' }

  /change-requests:
    get:
      summary: List CRs (scoped; newest submission first)
      parameters:
        - { name: projectId, in: query, schema: { type: integer } }
        - name: status
          in: query
          schema: { type: string }
          description: One status or a comma-separated list (submitted,returned,approved,rejected).
        - { name: requestedBy, in: query, schema: { type: integer } }
        - { name: mine, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequestListResponse' }

  /change-requests/{id}:
    get:
      summary: Get CR with history
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequestDetailResponse' }

  /change-requests/{id}/decision:
    post:
      summary: Decide CR (idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason, version]
              properties:
                decision: { type: string, enum: [approve, reject, return] }
                reason: { type: string }
                version: { type: integer }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequestDetailResponse' }
        '403': { description: Role cannot decide on this project }
        '409': { description: Version conflict or idempotency conflict }
        '422': { description: Self-approval (SELF_APPROVAL_FORBIDDEN) or bad state (INVALID_TRANSITION) }

  /change-requests/{id}/resubmit:
    post:
      summary: Resubmit returned CR (requester only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                title: { type: string }
                description: { type: string }
                version: { type: integer }
      responses:
        '200':
          description: Resubmitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequestDetailResponse' }

  # ── Budget ──
  /projects/{projectId}/budget:
    get:
      summary: Project budget (initial + approved revisions) and every revision
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetSummaryResponse' }

  /projects/{projectId}/budget-revisions:
    post:
      summary: Request budget revision (manage; created pending)
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, rationale, effectiveDate]
              properties:
                amount: { type: number, description: Non-zero; negative reduces the budget }
                rationale: { type: string, minLength: 10 }
                effectiveDate: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetRevisionResponse' }
        '422': { description: Would make the current budget negative (BUSINESS_RULE) }

  /budget-revisions/{id}/decision:
    post:
      summary: Decide budget revision (admin, idempotent, never own)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason, version]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string }
                # Required by the schema but not checked: revisions have no
                # version column (pending-status guard instead).
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetRevisionResponse' }
        '403': { description: Not an admin }
        '422': { description: Own revision (SELF_APPROVAL_FORBIDDEN) or not pending (INVALID_TRANSITION) }

  # ── Cost Categories ──
  /cost-categories:
    get:
      summary: List cost categories (active only unless admin + includeInactive)
      parameters:
        - { name: includeInactive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCategoryListResponse' }
    post:
      summary: Create cost category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCategoryResponse' }

  /cost-categories/{id}:
    patch:
      summary: Update cost category (admin); deactivation refused while drafts use it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCategoryResponse' }

  # ── Costs ──
  /projects/{projectId}/costs:
    get:
      summary: List project costs
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/costStatusParam' }
        - { $ref: '#/components/parameters/costCategoryParam' }
        - { $ref: '#/components/parameters/costFromParam' }
        - { $ref: '#/components/parameters/costToParam' }
        - { $ref: '#/components/parameters/costEntryTypeParam' }
        - { $ref: '#/components/parameters/costQParam' }
        - { $ref: '#/components/parameters/costSortParam' }
        - { $ref: '#/components/parameters/costOrderParam' }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostListResponse' }
    post:
      summary: Create draft cost
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, txnDate, amount, description]
              properties:
                categoryId: { type: integer }
                txnDate: { type: string, format: date }
                amount: { type: number, exclusiveMinimum: true, minimum: 0 }
                description: { type: string }
                vendor: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostDetailResponse' }

  /costs:
    get:
      summary: Cross-project costs (scoped)
      description: >-
        postedOnly=true&upToAsOf=true returns exactly the rows behind
        "actual spend" for the asOf date.
      parameters:
        - { name: projectId, in: query, schema: { type: integer } }
        - { name: departmentId, in: query, schema: { type: integer } }
        - { name: postedOnly, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: upToAsOf, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { $ref: '#/components/parameters/costStatusParam' }
        - { $ref: '#/components/parameters/costCategoryParam' }
        - { $ref: '#/components/parameters/costEntryTypeParam' }
        - { $ref: '#/components/parameters/costQParam' }
        - { $ref: '#/components/parameters/costSortParam' }
        - { $ref: '#/components/parameters/costOrderParam' }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostListResponse' }

  /costs/{id}:
    get:
      summary: Get cost
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostDetailResponse' }
    patch:
      summary: Update draft cost
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                categoryId: { type: integer }
                txnDate: { type: string, format: date }
                amount: { type: number }
                description: { type: string }
                vendor: { type: string, nullable: true }
                version: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostDetailResponse' }
        '409': { description: Version conflict, or the cost is posted (immutable) }
        '422': { description: Posted cost (INVALID_TRANSITION) or inactive category }
    delete:
      summary: Delete draft cost
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Deleted }

  /costs/{id}/post:
    post:
      summary: Post cost (idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostPostResponse' }
        '403': { description: Role cannot post costs on this project }

  /costs/{id}/reverse:
    post:
      summary: Reverse posted cost (adds a posted reversal entry)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                txnDate: { type: string, format: date }
      responses:
        '201':
          description: Reversal created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostDetailResponse' }
        '422': { description: Not a posted expense, or already reversed (INVALID_TRANSITION) }

  # ── Forecasts ──
  /projects/{projectId}/forecasts:
    get:
      summary: List forecasts
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastsResponse' }
    put:
      summary: Upsert forecasts (months after the asOf month, up to project end)
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/asOfParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [months]
              properties:
                months:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [month, amount]
                    properties:
                      month: { type: string, pattern: '^\d{4}-\d{2}$' }
                      amount: { type: number, minimum: 0 }
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastsResponse' }
        '422': { description: A month is not after the reporting month or is past project end }

  # ── Financial Summary ──
  /projects/{projectId}/financial-summary:
    get:
      summary: Full financial summary
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialSummaryResponse' }

  /finance/alerts:
    get:
      summary: Finance alerts (scoped)
      parameters:
        - { $ref: '#/components/parameters/asOfParam' }
        - { name: departmentId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceAlertsResponse' }

  /finance/comparison:
    get:
      summary: Side-by-side project comparison (1–10 ids; invisible ones listed in excluded)
      parameters:
        - { name: projectIds, in: query, required: true, schema: { type: string }, description: Comma-separated project ids }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceComparisonResponse' }

