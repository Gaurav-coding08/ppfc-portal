        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '404': { description: Not found or out of scope }
    patch:
      summary: Update project
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string }
                description: { type: string }
                departmentId: { type: integer }
                ownerId: { type: integer }
                status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                version: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProjectListItem' }
        '409': { description: Version conflict }

  /projects/{id}/members:
    get:
      summary: List project members
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
