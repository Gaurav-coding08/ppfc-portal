        '200': { description: OK }

  # ── Projects ──
  /projects:
    get:
      summary: List projects (scoped)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: integer } }
        - { name: ownerId, in: query, schema: { type: integer } }
        - name: status
          in: query
          description: One status or a comma-separated list (planning,active,on_hold,completed,cancelled).
          schema: { type: string }
        - { name: startFrom, in: query, schema: { type: string, format: date } }
        - { name: endTo, in: query, schema: { type: string, format: date } }
        - name: sort
          in: query
          schema: { type: string, enum: [code, name, status, startDate, endDate, progress], default: code }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
        - { $ref: '#/components/parameters/asOfParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, departmentId, ownerId, status, startDate, endDate, initialBudget]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                departmentId: { type: integer }
                ownerId: { type: integer }
                status: { type: string, enum: [planning, active, on_hold, completed, cancelled] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                initialBudget: { type: number, minimum: 0 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProjectListItem' }

  /projects/{id}:
    get:
