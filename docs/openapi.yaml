        - { $ref: '#/components/parameters/pageSizeParam' }
        - name: sort
          in: query
          schema: { type: string, enum: [fullName, email, role, createdAt], default: fullName }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '403': { description: Contributor not allowed }

  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
