        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSnapshotsResponse' }

  /projects/{projectId}/activity:
    get:
      summary: Project audit activity
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/pageSizeParam' }
      responses:
        '200':
